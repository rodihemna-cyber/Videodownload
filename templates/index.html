<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video to MP4</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Video → MP4</h1>
    <p class="sub">วางลิงก์วิดีโอ แล้วกดดาวน์โหลดเป็น MP4 คุณภาพสูง<br>Paste a video link to download it as a high-quality MP4.</p>

    <form id="form">
      <input id="url" type="url" placeholder="https://..." required autocomplete="off">
      <button id="go" type="submit">ดาวน์โหลด / Download</button>
    </form>
    <label class="opt">
      <input id="best" type="checkbox">
      Highest resolution (may be VP9/AV1 inside MP4, which some older players can't play)
    </label>

    <section id="status" hidden>
      <div class="bar"><div id="fill"></div></div>
      <p id="msg"></p>
      <a id="save" class="btn" hidden>บันทึกไฟล์ / Save MP4</a>
    </section>

    <p class="note">Only download videos you own or have permission to download.
      ดาวน์โหลดเฉพาะวิดีโอที่คุณมีสิทธิ์เท่านั้น</p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
